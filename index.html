<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SITE DE COMPRAS</title>
    <link rel="stylesheet" href="src/css/style.css">
    <link rel="icon" href="src/fonts/redstone_block.png" type="image/png">
</head>

<body>
    <main id="main-content">

        <header class="search-box" id="search">
            <h1>MEU SITE DE COMPRAS :</h1>
            <form role="search">
                <input id="categoria" type="search" placeholder="Pesquise produtos..." autocomplete="off">
            </form>
        </header>

        <section id="products" aria-label="Lista de Produtos">
        </section>

        <aside id="cart" aria-label="Carrinho de Compras">
            <h2>Carrinho</h2>
            <div id="cart-items"></div>
            
            <footer>
                <h2>Total</h2>
                <h3 id="TOTAL"></h3>
                <button id="clear-cart" type="button">APAGAR TUDO</button>
            </footer>
        </aside>

    </main>

    <script type="module" src="src/js/script.js"></script>
</body>
</html>
